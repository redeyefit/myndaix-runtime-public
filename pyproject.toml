[project]
name = "myndaix-runtime"
version = "0.1.0"
description = "MyndAIX Team Runtime - a deterministic spine that routes work to agent CLIs/APIs. A clean-room replacement for a coupled multi-agent runtime."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "psutil>=5.9",      # process-tree control
    "pexpect>=4.9",     # stubborn interactive CLIs
    "httpx>=0.27",      # api-reach agents (OpenAI-compatible chat) + the HTTP surface
    "google-api-python-client>=2.100",  # inbox assistant: Gmail + Drive REST (gmail_client)
    "google-auth>=2.23",                # refresh-token -> access-token mint (needs 2.x)
    "google-auth-httplib2>=0.2",        # discovery client's authorized-http shim
    "google-auth-oauthlib>=1.2",        # one-time per-account authorization flow
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.8"]
# MX Quality Orchestrator persona / Soul-ID face gate (critic.embed_face). Optional + heavy
# (downloads the buffalo_l ArcFace model on first use); the pure gate logic runs without it.
persona = ["insightface>=0.7", "onnxruntime>=1.17", "opencv-python-headless>=4.9", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runtime"]

[tool.ruff]
line-length = 100
# the per-run CI venv is created INSIDE the workspace (.ci-venv) — never lint it
extend-exclude = [".ci-venv"]

# PINNED to ruff 0.16.8 (dev extra). Ruff's DEFAULT rule set drifts between releases (0.16 turned on
# UP/BLE/FURB/SIM/I/… with no `select` configured → ~550 findings overnight), so `select` is EXPLICIT
# and limited to bug classes. Gate: tools/ruff_new.py blocks findings NEW vs the base commit
# (pre-existing debt never blocks; `ruff check --statistics` in CI prints it, report-only).
[tool.ruff.lint]
select = [
  "E9",       # syntax errors / unreadable files
  "F",        # pyflakes: undefined names (F821), unused imports/vars, redefinition, `is` with a literal
  "B",        # bugbear: mutable defaults, closures over loop vars, useless asserts/expressions …
  "PLE",      # pylint ERROR class (e.g. PLE2515 zero-width space — 1 real hit in tests at gate time)
  "PLW1510",  # subprocess.run without check= — a silently-ignored failure (24 in tree; new ones block)
  "ASYNC21",  # blocking subprocess/HTTP call inside `async def` — stalls the worker pool
  "ASYNC22",  # blocking process call inside `async def`
  "ASYNC23",  # blocking open() inside `async def`
  "S102",     # exec()
  "S307",     # eval()
  "S602",     # subprocess with shell=True
  "S605",     # os.system / shell start with a non-literal command
]
ignore = [
  "F541",     # f-string without placeholders — style
  "B007",     # unused loop control variable — style
  "B904",     # raise-without-from inside except — chaining hygiene, not a bug
  "B905",     # zip() without strict= — style
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends()` in a parameter default is the framework idiom, not a B008 bug
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# the suites define per-iteration closures that are awaited inside the same iteration — B023 cannot
# see that and false-positives on every one (9 at gate time)
"tests/**" = ["B023"]
